<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mimocode 供应商管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>mimocode 供应商管理</h1>
    <span id="config-path" class="path"></span>
    <button id="btn-variants" class="secondary">变体库</button>
    <button id="btn-add" class="primary">+ 添加供应商</button>
  </header>
  <main>
    <div id="list" class="cards"></div>
    <p id="empty" class="empty hidden">暂无供应商,点击右上角添加。</p>
  </main>

  <dialog id="form-dialog" aria-labelledby="form-title">
    <form id="provider-form" method="dialog">
      <header class="dlg-head">
        <h2 id="form-title">添加供应商</h2>
        <button type="button" id="btn-close" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <div class="dlg-body">
        <input type="hidden" id="f-original-id">
        <label>供应商标识 <input id="f-id" required pattern="[a-z0-9-]+" placeholder="my-provider"></label>
        <label>名称 <input id="f-name" required placeholder="例如:某中转站"></label>
        <label>API Key <input id="f-apiKey" required placeholder="sk-..."></label>
        <label>Base URL <input id="f-baseURL" required placeholder="https://api.example.com/v1"></label>
        <label>备注 <input id="f-note" placeholder="可选"></label>
        <label>官网链接 <input id="f-link" type="url" placeholder="可选 https://..."></label>
        <label class="checkbox"><input type="checkbox" id="f-default"> 设为默认供应商</label>
        <label id="default-model-row" hidden>
          <span>默认模型</span>
          <select id="f-default-model"></select>
        </label>
        <fieldset>
          <legend>模型配置</legend>
          <div id="models" class="model-table"></div>
          <div class="row">
            <input id="f-model-new" placeholder="模型 id,如 deepseek-v4-flash">
            <button type="button" id="btn-add-model">添加模型</button>
            <button type="button" id="btn-fetch-models">获取模型</button>
          </div>
        </fieldset>
      </div>
      <footer class="dlg-foot">
        <button type="button" id="btn-cancel" class="secondary">取消</button>
        <button type="submit" class="primary">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="variants-dialog" aria-labelledby="variants-title">
    <header class="dlg-head">
      <h2 id="variants-title">官方变体库</h2>
      <button type="button" id="vb-close" class="icon-btn" aria-label="关闭">×</button>
    </header>
    <div class="dlg-body">
      <div id="vb-form-wrap" class="hidden">
        <form id="vb-form" class="vb-form">
          <label>模型 ID <input id="vb-id" required pattern="[a-zA-Z0-9._:+-]+" placeholder="gpt-5.6-luna"></label>
          <label>显示名 <input id="vb-name" placeholder="可选"></label>
          <label>变体列表(逗号分隔) <input id="vb-variants" required placeholder="low, medium, high, xhigh, max"></label>
          <label>上下文 <input id="vb-limit-context" inputmode="numeric" placeholder="可选,如 200000"></label>
          <label>输出 <input id="vb-limit-output" inputmode="numeric" placeholder="可选,如 64000"></label>
          <label class="vb-modalities">模态
            <span><input type="checkbox" data-vbmod="text" checked disabled> text</span>
            <span><input type="checkbox" data-vbmod="image"> image</span>
            <span><input type="checkbox" data-vbmod="audio"> audio</span>
            <span><input type="checkbox" data-vbmod="video"> video</span>
            <span><input type="checkbox" data-vbmod="pdf"> pdf</span>
          </label>
          <label>推理
            <select id="vb-reasoning">
              <option value="">未设置</option>
              <option value="true">支持</option>
              <option value="false">不支持</option>
            </select>
          </label>
          <label>来源 <input id="vb-source" placeholder="文档链接或说明"></label>
          <div class="vb-form-actions">
            <button type="button" id="vb-form-cancel" class="secondary">取消</button>
            <button type="submit" class="primary">保存</button>
          </div>
        </form>
      </div>
      <div class="vb-toolbar">
        <span class="vb-hint" id="vb-hint">手动维护,查官方文档确认支持哪些思考强度后录入</span>
        <div class="vb-ops">
          <button id="vb-extract" class="secondary" title="mimo 升级后点击,重新提取内置目录(mimo.json)">重新提取内置目录</button>
          <button id="vb-add" class="secondary">+ 新增条目</button>
        </div>
      </div>
      <div id="vb-list"></div>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
